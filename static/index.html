<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoDrop</title>
<style>
#status { list-style: none; padding: 0; }
#status li { padding: 8px 0; border-bottom: 1px solid #ccc; overflow-wrap: anywhere; }
</style>
</head>
<body>
<h1>PhotoDrop</h1>
<form method="post" action="/upload" enctype="multipart/form-data">
<input type="file" name="file" multiple>
<button type="submit">Upload</button>
</form>
<ul id="status"></ul>
<script>
const form = document.querySelector("form");
const status = document.getElementById("status");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = form.querySelector("button");
  const input = form.elements.file;
  const files = [...input.files];
  button.disabled = true;
  input.disabled = true;
  status.replaceChildren();
  let allOk = true;
  try {
    for (const file of files) {
      const line = document.createElement("li");
      line.textContent = file.name + ": uploading...";
      status.append(line);
      const body = new FormData();
      body.append("file", file, file.name);
      try {
        const response = await fetch(form.action, { method: "POST", body });
        line.textContent = file.name + ": " + await response.text();
        if (!response.ok) allOk = false;
      } catch (err) {
        line.textContent = file.name + ": failed " + err.message;
        allOk = false;
      }
    }
    if (allOk) form.reset();
  } finally {
    button.disabled = false;
    input.disabled = false;
  }
});
</script>
</body>
</html>
