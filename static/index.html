<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoDrop</title>
<style>
#status { list-style: none; padding: 0; }
#status li { padding: 8px 0; border-bottom: 1px solid #ccc; overflow-wrap: anywhere; }
#health { position: fixed; top: 8px; right: 8px; padding: 4px 10px; border-radius: 12px; color: #fff; background: #888; font: 14px sans-serif; }
#health.online { background: #2a7d2a; }
#health.offline { background: #b02a2a; }
</style>
</head>
<body>
<div id="health">checking...</div>
<h1>PhotoDrop</h1>
<form method="post" action="/upload" enctype="multipart/form-data">
<input type="file" name="file" multiple>
<button type="submit">Upload</button>
</form>
<ul id="status"></ul>
<button type="button" id="retry" hidden>Retry failed</button>
<script>
const form = document.querySelector("form");
const status = document.getElementById("status");
const retry = document.getElementById("retry");
const button = form.querySelector("button");
const input = form.elements.file;
let failed = [];

async function uploadAll(files) {
  button.disabled = true;
  input.disabled = true;
  retry.hidden = true;
  status.replaceChildren();
  failed = [];
  try {
    for (const file of files) {
      const line = document.createElement("li");
      line.textContent = file.name + ": uploading...";
      status.append(line);
      const body = new FormData();
      body.append("file", file, file.name);
      try {
        const response = await fetch(form.action, { method: "POST", body });
        line.textContent = file.name + ": " + await response.text();
        if (!response.ok) failed.push(file);
      } catch {
        line.textContent = file.name + ": failed, can't reach the laptop. Is it awake and is PhotoDrop running?";
        failed.push(file);
      }
    }
    if (failed.length === 0) form.reset();
  } finally {
    button.disabled = false;
    input.disabled = false;
    retry.hidden = failed.length === 0;
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  uploadAll([...input.files]);
});
retry.addEventListener("click", () => uploadAll(failed));

const health = document.getElementById("health");
async function checkHealth() {
  let ok = false;
  try {
    const response = await fetch("/", { method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(3000) });
    ok = response.ok;
  } catch {}
  health.textContent = ok ? "online" : "offline";
  health.className = ok ? "online" : "offline";
}
checkHealth();
setInterval(checkHealth, 5000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkHealth();
});
</script>
</body>
</html>
